<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sblocco Video - Verifica di Sicurezza</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #212121;
            border: 1px solid #383838;
            border-radius: 12px;
            padding: 32px 24px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .video-placeholder {
            width: 100%;
            height: 180px;
            background-color: #121212;
            border: 1px dashed #444;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            color: #aaa;
        }

        .video-placeholder svg {
            width: 48px;
            height: 48px;
            fill: #666;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .captcha-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            min-height: 78px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Area Anteprima Video Bloccato -->
        <div class="video-placeholder">
            <svg viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3 3.1-3 1.71 0 3.1 1.29 3.1 3v2z"/>
            </svg>
            <span>Contenuto Protetto</span>
        </div>

        <h2>Verifica di Sicurezza</h2>
        <p>Completa il reCAPTCHA sottostante per verificare che sei un utente reale e accedere alla riproduzione del video.</p>

        <!-- Widget Google reCAPTCHA v2 -->
        <div class="captcha-container">
            <div class="g-recaptcha" 
                 data-sitekey="6Lfl8PktAAAAACRqUO6XuIW1btN_jlHj_mymPKei" 
                 data-theme="dark" 
                 data-callback="riavviaLoop">
            </div>
        </div>
    </div>

    <!-- Script API di Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Script JS per gestire il reset infinito -->
    <script>
        function riavviaLoop(token) {
            // Non appena l'utente completa le immagini e ottiene il segno di spunta verde,
            // aspettiamo 1 secondo prima di azzerare nuovamente il widget.
            setTimeout(function() {
                if (typeof grecaptcha !== 'undefined') {
                    grecaptcha.reset();
                }
            }, 1000);
        }
    </script>

</body>
</html>
